<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 屏蔽所有方正（FZ）系字体：按文件路径匹配 -->
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/wps-office/FZ*.TTF</glob>
      <glob>/usr/share/fonts/wps-office/FZ*.ttf</glob>
      <glob>/usr/share/fonts/TTF/方正*.ttf</glob>
      <glob>/usr/share/fonts/TTF/方正*.TTF</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
