<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- serif 使用 Noto Serif CJK SC（简体中文），强绑定覆盖 KR -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- 除衬线外，所有非等宽英文/中文使用微软雅黑 -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>微软雅黑</family>
      <family>Microsoft YaHei</family>
    </prefer>
  </alias>

  <!-- monospace 中文字形回退使用 SC 而非 KR -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
